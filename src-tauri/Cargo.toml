[package]
name = "create-vibe-start-desktop"
version = "0.1.3"
description = "Desktop interface for create-vibe-start"
authors = ["Vibe Start"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "create_vibe_start_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
