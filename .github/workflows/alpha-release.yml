name: Alpha Release Gate

on:
  push:
    branches:
      - release/alpha
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alpha-release:
    if: github.ref == 'refs/heads/release/alpha'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package and npm alpha versions
        id: version-gate
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

          if ! ALL_VERSIONS_JSON="$(npm view "${PACKAGE_NAME}" versions --json)"; then
            echo "Failed to fetch versions from npm registry for ${PACKAGE_NAME}."
            exit 1
          fi

          if [ -z "${ALL_VERSIONS_JSON}" ]; then
            echo "npm returned an empty response for ${PACKAGE_NAME} versions."
            exit 1
          fi

          ALL_VERSIONS_JSON="${ALL_VERSIONS_JSON}" PACKAGE_VERSION="${PACKAGE_VERSION}" node <<'EOF'
          const fs = require("node:fs");

          const outputPath = process.env.GITHUB_OUTPUT;
          const packageVersion = process.env.PACKAGE_VERSION;
          const raw = process.env.ALL_VERSIONS_JSON ?? "[]";

          const writeOutput = (name, value) => {
            fs.appendFileSync(outputPath, `${name}=${value}\n`);
          };

          const parseVersion = (input) => {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(input);
            if (!match) {
              return null;
            }
            const prerelease = match[4]
              ? match[4].split(".").map((part) =>
                  /^\d+$/.test(part) ? Number(part) : part
                )
              : [];
            return {
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3]),
              prerelease,
            };
          };

          const compareIdentifiers = (a, b) => {
            const aIsNumber = typeof a === "number";
            const bIsNumber = typeof b === "number";
            if (aIsNumber && bIsNumber) {
              return a - b;
            }
            if (aIsNumber && !bIsNumber) {
              return -1;
            }
            if (!aIsNumber && bIsNumber) {
              return 1;
            }
            if (a < b) {
              return -1;
            }
            if (a > b) {
              return 1;
            }
            return 0;
          };

          const compareSemver = (leftRaw, rightRaw) => {
            const left = parseVersion(leftRaw);
            const right = parseVersion(rightRaw);
            if (!left || !right) {
              throw new Error(`Invalid semver compare: ${leftRaw} vs ${rightRaw}`);
            }
            if (left.major !== right.major) {
              return left.major - right.major;
            }
            if (left.minor !== right.minor) {
              return left.minor - right.minor;
            }
            if (left.patch !== right.patch) {
              return left.patch - right.patch;
            }

            const leftPre = left.prerelease;
            const rightPre = right.prerelease;
            if (!leftPre.length && !rightPre.length) {
              return 0;
            }
            if (!leftPre.length) {
              return 1;
            }
            if (!rightPre.length) {
              return -1;
            }

            const length = Math.max(leftPre.length, rightPre.length);
            for (let index = 0; index < length; index += 1) {
              const l = leftPre[index];
              const r = rightPre[index];
              if (l === undefined) {
                return -1;
              }
              if (r === undefined) {
                return 1;
              }
              const compared = compareIdentifiers(l, r);
              if (compared !== 0) {
                return compared;
              }
            }
            return 0;
          };

          let parsedRaw;
          try {
            parsedRaw = JSON.parse(raw);
          } catch (error) {
            throw new Error(`Unable to parse npm versions JSON: ${error.message}`);
          }
          const versions = Array.isArray(parsedRaw) ? parsedRaw : [parsedRaw];
          const alphaVersions = versions.filter((value) => typeof value === "string" && value.includes("-alpha."));

          const sortedAlpha = [...alphaVersions].sort(compareSemver);
          const latestNpmAlpha = sortedAlpha.length > 0 ? sortedAlpha[sortedAlpha.length - 1] : "";
          writeOutput("latest_npm_alpha", latestNpmAlpha);

          if (!packageVersion.includes("-alpha.")) {
            writeOutput("should_release", "false");
            writeOutput("reason", "package-version-is-not-alpha");
            process.exit(0);
          }

          if (!latestNpmAlpha) {
            writeOutput("should_release", "true");
            writeOutput("reason", "no-alpha-version-on-npm");
            process.exit(0);
          }

          if (compareSemver(packageVersion, latestNpmAlpha) > 0) {
            writeOutput("should_release", "true");
            writeOutput("reason", "package-version-is-newer-than-npm-alpha");
            process.exit(0);
          }

          writeOutput("should_release", "false");
          writeOutput("reason", "package-version-is-not-newer-than-npm-alpha");
          EOF

      - name: Print gate result
        run: |
          echo "package_name=${{ steps.version-gate.outputs.package_name }}"
          echo "package_version=${{ steps.version-gate.outputs.package_version }}"
          echo "latest_npm_alpha=${{ steps.version-gate.outputs.latest_npm_alpha }}"
          echo "should_release=${{ steps.version-gate.outputs.should_release }}"
          echo "reason=${{ steps.version-gate.outputs.reason }}"

      - name: Create and push git tag
        if: steps.version-gate.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version-gate.outputs.package_version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; skip creating tag."
            exit 0
          fi

          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub prerelease
        if: steps.version-gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version-gate.outputs.package_version }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing RELEASE_TOKEN secret. This token is required so the release event can trigger npm publish workflow."
            exit 1
          fi

          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skip creating release."
            exit 0
          fi

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "${TAG}" \
            --generate-notes

      - name: Skip release
        if: steps.version-gate.outputs.should_release != 'true'
        run: echo "Skipping alpha release. ${{ steps.version-gate.outputs.reason }}"
