name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm coverage

      - name: Build and verify local setup package
        run: pnpm verify:local-setup

      - name: Build desktop web UI
        run: pnpm desktop:web:build

  desktop-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            runtime: darwin-universal
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            runtime: windows-x64
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled tool runtime
        shell: bash
        run: bash scripts/prepare-desktop-runtime.sh "${{ matrix.runtime }}"

      - name: Build unsigned installer candidate
        run: |
          pnpm desktop:prepare
          pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
